repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^scripts/
      - id: ruff-format
        exclude: ^scripts/

# scripts/ enthaelt ausschliesslich Artefakte des Workflow-Guard-Systems
# (kanonische Quelle: workflow-guard-system/plugin/scripts/, siehe
# scripts/README.md). Der eigene Formatter darf sie nicht anfassen: ruff-format
# haette review_gate.py umformatiert (Slice-Abstand), und `tools/guard status`
# meldet jede Abweichung von der Quelle als DRIFT. Fremde Artefakte formatiert
# man nicht nach - man aendert die Quelle oder laesst sie in Ruhe.
